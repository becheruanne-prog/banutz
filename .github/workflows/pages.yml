# Every pull request and every merge into main: run the tests and build the app. Nothing is published.
# The website (banutz.ro) is published ONLY when Anne starts this workflow by hand ("Run workflow"),
# and the github-pages environment then waits for her approval. Merging a pull request never changes the site.
name: Test, build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp privacy.html _site/privacy.html
          cp manifest.webmanifest og.png icon-192.png icon-512.png apple-touch-icon.png _site/
          cp -r samples _site/samples
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
